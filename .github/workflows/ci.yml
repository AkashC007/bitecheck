name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e "apps/api[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy scripts apps/api/src apps/api/tests tests
      - name: Test
        run: pytest
      - name: Check dependencies
        run: python -m pip check

  frontend:
    name: TypeScript quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
